# Profil test : H2 en mémoire + Mongo via Testcontainers (voir SecurityFilterChainIntegrationTest).
spring.datasource.url=jdbc:h2:mem:agenticform_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false

DB_PASSWORD=
MONGO_URI=mongodb://localhost:27017/agenticform_test

jwt.secret=integration-test-jwt-secret-32chars-min!!
jwt.expiration-ms=3600000

GOOGLE_CLIENT_ID=test-google-client-id
GOOGLE_CLIENT_SECRET=test-google-client-secret
AZURE_CLIENT_ID=test-azure-client-id
AZURE_CLIENT_SECRET=test-azure-client-secret
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.azure.client-id=test-azure-client-id
spring.security.oauth2.client.registration.azure.client-secret=test-azure-client-secret

spring.mail.host=localhost
spring.mail.port=1025
app.media.storage-dir=./target/test-media
app.admin.bootstrap-email=

RECAPTCHA_SECRET_KEY=test-recaptcha-secret
app.recaptcha.secret-key=test-recaptcha-secret

# Ollama absent en CI — URL invalide pour éviter une connexion au démarrage des tests IA.
spring.ai.ollama.base-url=http://127.0.0.1:1
