# Profil PROD : durcissement (ANSSI / RGPD).
# Le schema n'est PAS modifie automatiquement : il est seulement valide.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pas de fuite d'informations techniques dans les logs de production.
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.web=WARN

# Aucune divulgation de details de sante en production.
management.endpoint.health.show-details=never