# Profil DEV : confort de developpement (schema auto, traces SQL).
# Ne jamais utiliser ces reglages en production.
spring.jpa.hibernate.ddl-auto=update
# Flyway désactivé en dev : le schéma est géré par Hibernate (update).
# En prod, Flyway pilote le DDL (validate).
spring.flyway.enabled=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# En dev, on tolere l'affichage des details de sante pour le diagnostic local.
management.endpoint.health.show-details=always

# SMTP (dev) — Mailpit : pas d'authentification ni TLS (port 1025).
# Host/from définis dans application.properties ; overrides locaux possibles ici.
spring.mail.host=${SPRING_MAIL_HOST:mailpit}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:no-reply@agenticforms.com}
app.mail.contact-to=${CONTACT_TO:contact@agenticforms.com}