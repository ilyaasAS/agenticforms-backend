# Configuration commune (independante de l'environnement).
# Le profil actif est pilote par SPRING_PROFILES_ACTIVE (defaut : dev en local).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Bloc 2 : Configuration MySQL (SQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:agenticform}
spring.datasource.username=${DB_USER:esport_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Bloc 2 : Configuration MongoDB (NoSQL)
spring.data.mongodb.uri=${MONGO_URI}

# Securite (JWT)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:3600000}

# Actuator : n'expose que la sonde de sante (health), sans details par defaut (Healthcheck Docker).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Configuration IA (Optionnel)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2:3b}